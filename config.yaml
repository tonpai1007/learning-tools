# Learning Tools configuration
# Everything here can be overridden on the command line.

ai:
  model: "gpt-4o-mini"          # or "llama3.2" / "gemini-2.0-flash" / whatever your provider exposes
  temperature: 0.7
  max_cards: 20                 # flashcards per chunk batch
  max_quiz_questions: 10
  max_tokens: 2048

ingest:
  # Files are read from the sources/ folder. Uncomment lines to ignore types.
  ignore: []                    # e.g. ["image_*.png"]

chunker:
  chunk_tokens: 1200            # approximate size of each knowledge chunk
  overlap_tokens: 120

tutor:
  k: 6                          # how many context chunks the tutor retrieves per question
  max_history: 10               # conversation turns remembered

output:
  dir: "output"
  data_dir: "data"

# Spaced repetition (SM-2 style)
spaced_repetition:
  ease: 2.5
  learning_interval_min: 10     # minutes
  grad_interval_h: 24           # hours for graduating a card
